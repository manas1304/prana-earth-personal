[project]
name = "prana-climate"
version = "0.1.0"
description = "Prana Earth — Climate data pipeline (ESGF → EC2 → S3 → H3)."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Prana Earth" }]

dependencies = [
    # Data
    "xarray>=2023.1.0",
    "netcdf4>=1.6.0",
    "cftime>=1.6.0",
    "h3>=4.1.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # AWS
    "boto3>=1.34.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # Optional: enabled via env PRANA_REDIS_URL
    # "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "moto>=5.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prana_climate*"]
